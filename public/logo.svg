<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Main node / server -->
  <rect x="16" y="4" width="16" height="12" rx="3" fill="url(#logo-grad)" opacity="0.9"/>
  <rect x="19" y="7" width="10" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="19" y="11" width="6" height="2" rx="1" fill="white" opacity="0.5"/>
  <!-- Lines from main to children -->
  <line x1="20" y1="16" x2="10" y2="26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="16" x2="24" y2="26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="16" x2="38" y2="26" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left node -->
  <rect x="4" y="26" width="12" height="10" rx="2.5" fill="#1e1e2e" stroke="#6366f1" stroke-width="1.2"/>
  <rect x="6" y="29" width="8" height="1.5" rx="0.75" fill="#6366f1" opacity="0.5"/>
  <rect x="6" y="32" width="5" height="1.5" rx="0.75" fill="#06b6d4" opacity="0.5"/>
  <!-- Center node -->
  <rect x="18" y="26" width="12" height="10" rx="2.5" fill="#1e1e2e" stroke="#06b6d4" stroke-width="1.2"/>
  <rect x="20" y="29" width="8" height="1.5" rx="0.75" fill="#06b6d4" opacity="0.5"/>
  <rect x="20" y="32" width="5" height="1.5" rx="0.75" fill="#f59e0b" opacity="0.5"/>
  <!-- Right node -->
  <rect x="32" y="26" width="12" height="10" rx="2.5" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="34" y="29" width="8" height="1.5" rx="0.75" fill="#f59e0b" opacity="0.5"/>
  <rect x="34" y="32" width="5" height="1.5" rx="0.75" fill="#6366f1" opacity="0.5"/>
  <!-- Bottom connections -->
  <line x1="10" y1="36" x2="10" y2="42" stroke="#6366f1" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="24" y1="36" x2="24" y2="42" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="38" y1="36" x2="38" y2="42" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
  <!-- DB icons -->
  <ellipse cx="10" cy="43" rx="4" ry="2" fill="#6366f1" opacity="0.3"/>
  <ellipse cx="24" cy="43" rx="4" ry="2" fill="#06b6d4" opacity="0.3"/>
  <ellipse cx="38" cy="43" rx="4" ry="2" fill="#f59e0b" opacity="0.3"/>
  <defs>
    <linearGradient id="logo-grad" x1="16" y1="4" x2="32" y2="16">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
</svg>
